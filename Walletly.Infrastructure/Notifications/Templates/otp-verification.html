<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification code</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1d1d1f;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:32px;">
        <p style="margin:0 0 16px;font-size:16px;">Hi {{first_name}},</p>
        <p style="margin:0 0 24px;font-size:16px;">Use this code to verify your identity:</p>
        <p style="margin:0 0 24px;font-size:32px;font-weight:bold;letter-spacing:6px;">{{otp_code}}</p>
        <p style="margin:0 0 8px;font-size:14px;color:#555555;">This code expires in {{expires_in_minutes}} minutes.</p>
        <p style="margin:0;font-size:14px;color:#555555;">If you did not request this code, you can ignore this email.</p>
      </td>
    </tr>
  </table>
</body>
</html>
