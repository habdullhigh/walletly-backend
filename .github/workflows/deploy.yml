name: Build, Test & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Walletly.slnx

      - name: Build solution
        run: dotnet build Walletly.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Walletly.slnx --configuration Release --no-build --verbosity normal

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            export PATH="$PATH:$HOME/.dotnet:/usr/local/bin"

            APP_DIR="${{ vars.VPS_APP_DIR || '/var/www/walletly-backend' }}"
            PUBLISH_DIR="${{ vars.VPS_PUBLISH_DIR || '/var/www/walletly-api' }}"
            SERVICE_NAME="${{ vars.VPS_SERVICE_NAME || 'walletly.service' }}"

            echo "==> Pulling latest changes in $APP_DIR..."
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Publishing Walletly.Api to $PUBLISH_DIR..."
            dotnet publish Walletly.Api/Walletly.Api.csproj -c Release -o "$PUBLISH_DIR"

            echo "==> Restarting systemd service ($SERVICE_NAME)..."
            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl is-active --quiet "$SERVICE_NAME" && echo "==> $SERVICE_NAME is running!"

